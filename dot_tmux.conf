# unbind C-b
set -g prefix `
bind ` send-prefix
bind | split-window -h

unbind -T prefix [
# enter copy-mode AND start selecting on the current line
bind -T prefix [ copy-mode \; send-keys -X begin-selection

bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Modern terminal settings
#set -g default-terminal "tmux-256color"
set -g default-terminal "screen-256color"
set -sa terminal-features ",xterm-256color:RGB"

# Vim-tmux navigation
# Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Restore clear screen with prefix+C-l
bind C-l send-keys 'C-l'

if-shell "test -f ~/.config/tmux/theme.conf" "source-file ~/.config/tmux/theme.conf"

# Modern styling
set -g set-titles on
set -g set-titles-string '#S: #T' # window number,program name, active(or not)
set -g history-limit 10000
set -g mouse on
set -g status on
set -g status-interval 2
set -g status-justify "centre"
set -g status-left-length 60
set -g status-right-length 90
if-shell "test -f ~/.tmux-powerline/powerline.sh" \
  "set -g status-left '#(~/.tmux-powerline/powerline.sh left)'; set -g status-right '#(~/.tmux-powerline/powerline.sh right)'"
setw -g window-status-current-format " #I$ #W "

# Vim mode settings
set -g status-keys vi
setw -g mode-keys vi

# Modern copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Session management keybindings
bind S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind K confirm kill-session

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Plugin configuration
set -g @continuum-restore 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -ga terminal-overrides ',*:Sm=\E]1337;SetMark\007,Ms=\E]52;%p1%s;%p2%s\007'
set -ga terminal-features 'xterm*:hyperlinks,osc133'

